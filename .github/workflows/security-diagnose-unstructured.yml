name: Diagnose unstructured lock
on:
  push:
    branches: [security/unstructured-0.24.0-20260926]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/unstructured-0.24.0-20260926
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Root reverse dependency tree
        run: |
          uv tree --locked --invert --package unstructured || true
          uv tree --locked --python 3.11 --invert --package unstructured || true
          uv tree --locked --python 3.12 --invert --package unstructured || true
          uv tree --locked --python 3.13 --invert --package unstructured || true
      - name: MCP reverse dependency tree
        run: |
          cd cognee-mcp
          uv tree --locked --invert --package unstructured || true
          uv tree --locked --python 3.11 --invert --package unstructured || true
          uv tree --locked --python 3.12 --invert --package unstructured || true
          uv tree --locked --python 3.13 --invert --package unstructured || true
