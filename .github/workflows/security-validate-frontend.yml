name: Validate frontend security lock
on:
  push:
    branches: [security/frontend-yaml-minimatch-20260926]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognee-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/frontend-yaml-minimatch-20260926
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cognee-frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --runInBand
