name: Security pytest lock refresh
on:
  push:
    branches:
      - security/pytest-9.1.1-post-sync-20260926
permissions:
  contents: write
jobs:
  refresh-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/pytest-9.1.1-post-sync-20260926
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Refresh root pytest lock
        run: uv lock --upgrade-package pytest
      - name: Refresh MCP pytest lock
        run: |
          cd cognee-mcp
          uv lock --upgrade-package pytest
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock cognee-mcp/uv.lock
          git diff --cached --quiet && exit 1
          git commit -m "security: refresh pytest locks"
          git push origin HEAD:security/pytest-9.1.1-post-sync-20260926
