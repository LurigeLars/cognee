name: Security lock refresh

on:
  push:
    branches:
      - security/cognee-anyio-4.14.2-20260926

permissions:
  contents: write

jobs:
  refresh-anyio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/cognee-anyio-4.14.2-20260926

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0

      - name: Refresh AnyIO only
        run: |
          cd cognee-mcp
          uv lock --upgrade-package anyio

      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- cognee-mcp/uv.lock; then
            echo "No lockfile change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognee-mcp/uv.lock
          git commit -m "security: refresh anyio lock to 4.14.2"
          git push origin HEAD:security/cognee-anyio-4.14.2-20260926
