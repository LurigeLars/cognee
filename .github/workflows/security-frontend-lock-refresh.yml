name: Security frontend lock refresh
on:
  push:
    branches: [security/frontend-yaml-minimatch-20260926]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/frontend-yaml-minimatch-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh vulnerable transitive packages
        run: |
          cd cognee-frontend
          npx --yes npm@11.20.0 update js-yaml minimatch --package-lock-only --ignore-scripts
      - name: Commit focused lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognee-frontend/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "security: refresh js-yaml and minimatch"
          git pull --rebase origin security/frontend-yaml-minimatch-20260926
          git push origin HEAD:security/frontend-yaml-minimatch-20260926
